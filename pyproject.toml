[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chaptergen"
dynamic = ["version"]
description = "CLI tool that generates YouTube chapters from video transcripts using LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
all = [
    "chaptergen[openai,dev]",
]

[project.scripts]
chaptergen = "chaptergen.cli:main"

[tool.hatch.version]
path = "src/chaptergen/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/chaptergen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
